# Version updates, weekly, for every lockfile igni ships from, and for the
# actions the workflows run. Security updates (Dependabot alerts) are a
# repository setting and open their own pull requests whenever an advisory
# lands; this file is the routine half.
#
# Minor and patch updates are grouped per directory so a week's drift is one
# pull request to review, not twenty. Majors arrive one by one, because each
# is a decision. An action pinned by commit SHA with a `# vX.Y.Z` comment
# (OpenSSF Scorecard's Pinned-Dependencies check) is updated SHA and comment
# together.
version: 2
updates:
  # The web UI every client bundles.
  - package-ecosystem: npm
    directory: /clients/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The desktop shell.
  - package-ecosystem: cargo
    directory: /clients/tauri/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Actions too: minor and patch grouped, each major its own pull request.
  # A major action release changes inputs and outputs (release.yml, which
  # CI cannot exercise, is where that bites), so it is reviewed against its
  # changelog on its own rather than inside a bundle of nine.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
