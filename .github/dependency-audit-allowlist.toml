# Exceptions to the npm and cargo dependency gate (scripts/dependency_audit.py).
#
# The gate fails on any advisory at or above `critical` that is not named
# here. An entry names ONE advisory against ONE package, says why it does not
# reach anything igni runs (or why there is nothing to take), and carries a
# `review_by` date: after it, the gate fails until somebody re-reads the
# advisory and moves the date or deletes the entry. An entry that stops
# matching is reported so it can be deleted.
#
# Python has no entries and takes none: pip-audit in ci.yml fails on every
# advisory. docs/VULNERABILITY_MANAGEMENT.md describes the whole policy.
#
#   [[allow]]
#   ecosystem = "npm" | "cargo"
#   advisory  = "GHSA-…" | "RUSTSEC-…" (or any alias the tool reports)
#   package   = "<name as the tool reports it>"
#   reason    = "…"
#   review_by = 2027-01-31
