name: Release

on:
  push:
    tags:
      - "v*"

# The desktop app. igni's backend is released from ignite-ember/igni-core
# under the same version; this checks that version is on PyPI before it
# builds anything (core-published).
#
# Read-only by default. The jobs that write to the release say so
# themselves (`contents: write`), and the one job that mints provenance
# asks for `id-token` and `attestations` on its own.
permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check actor is repo admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::Releases can only be triggered by repo admins. Actor '${{ github.actor }}' has '$PERMISSION' permission."
            exit 1
          fi

  ci:
    needs: authorize
    uses: ./.github/workflows/ci.yml

  # The desktop app installs igni's backend on first launch, pinned to its
  # own version (``ignite-ember==CARGO_PKG_VERSION``). So a release is the
  # version igni-core already published to PyPI, and nothing else: the tag
  # must name ``igni-core.version``, the committed Tauri files must carry
  # it, and PyPI must serve it — or the app would ship pointing at a
  # backend no one can install.
  core-published:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag names igni-core.version
        run: |
          set -euo pipefail
          TAG_V="${GITHUB_REF#refs/tags/v}"
          CORE_V="$(tr -d '[:space:]' < igni-core.version)"
          if [ "$TAG_V" != "$CORE_V" ]; then
            echo "::error::tag v$TAG_V does not match igni-core.version $CORE_V — set igni-core.version (and run scripts/sync-version.mjs) or retag"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: The committed Tauri files carry it
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs
          if ! git diff --quiet; then
            echo "::error::the Tauri version files were not in sync with igni-core.version — run 'node scripts/sync-version.mjs' and commit before tagging"
            git diff --stat
            exit 1
          fi

      - name: PyPI serves that backend
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < igni-core.version)"
          for i in $(seq 1 20); do
            if curl -fsSL -o /dev/null "https://pypi.org/pypi/ignite-ember/${VERSION}/json"; then
              echo "ignite-ember ${VERSION} is on PyPI"
              exit 0
            fi
            echo "  attempt $i/20 — not yet, waiting 30s"
            sleep 30
          done
          echo "::error::ignite-ember ${VERSION} is not on PyPI; release igni-core v${VERSION} first"
          exit 1

  # Tauri desktop installers — see build-tauri below. Why a draft first:
  # ``tauri-action`` needs a ``releaseId`` to upload to, and the matrix
  # legs racing to create the release by tag failed with "Release not
  # found or created"; pre-creating it as a draft serialises that, and
  # ``github-release`` publishes it at the end.
  prepare-release:
    needs: core-published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        id: create
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          # Pre-releases (rc/alpha/beta/dev tags) get the
          # "Pre-release" badge on the releases page so users don't
          # accidentally pick them up as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Leave body empty here — the ``github-release`` job at
          # the end of the workflow generates + sets the final body
          # once every artifact has landed.
          body: ""

  # Tauri desktop installers — mac (Apple Silicon only), windows, linux.
  # Tauri Action handles the per-platform bundle (.dmg/.msi/.AppImage),
  # generates the updater signatures, and uploads everything to the
  # GitHub Release. ``tagName`` matches the tag we're already on so
  # all artifacts land on one release page.
  #
  # Secrets required (configure in repo → Settings → Secrets):
  #   TAURI_SIGNING_PRIVATE_KEY          base64 of the updater priv key
  #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD passphrase for the priv key
  # Optional (Apple notarization):
  #   APPLE_CERTIFICATE                  .p12 base64
  #   APPLE_CERTIFICATE_PASSWORD
  #   APPLE_SIGNING_IDENTITY             "Developer ID Application: …"
  #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
  build-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The web bundle builds the SDKs from igni-sdk's source, at
      # ../igni-sdk beside this checkout (clients/web/tsconfig.json's
      # `paths`). A checkout lands inside the workspace, so it is moved out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-sdk
          path: .igni-sdk
          persist-credentials: false

      - name: Put igni-sdk beside this checkout
        shell: bash
        run: mv .igni-sdk ../igni-sdk

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clients/tauri/src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Build shared web UI
        run: |
          cd clients/web
          npm ci
          npm run build

      # Validate notarytool auth before doing 4 min of cargo build +
      # 1 min of codesign just to discover the credentials are wrong.
      # ``notarytool history`` is a cheap auth-only call; on bad
      # creds it exits non-zero with a clear "Authentication failed"
      # in ~5 seconds, fast-failing the run.
      - name: Preflight notarytool credentials (macOS)
        if: matrix.platform == 'macos-26'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            | head -20

      - name: Build + sign + upload Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID *signing only*. We deliberately do NOT
          # pass APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID here —
          # those would trigger tauri-action's built-in
          # ``notarytool submit --wait`` which blocks the whole job
          # for however long Apple's queue takes with zero log
          # output (the v0.7.0-rc.1 dry run hung ~30 min on it). We
          # do notarization ourselves in the next step with per-poll
          # progress logging.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: clients/tauri
          tagName: ${{ github.ref_name }}
          # ``releaseId`` previously came from
          # ``github.event.release.id`` (empty under a push-tag
          # event); then omitted (action couldn't find-or-create
          # reliably across the parallel matrix). Now sourced from
          # the ``prepare-release`` job which pre-creates a draft
          # release exactly once — matrix legs upload to that id.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # No updater JSON from the action: the ``updater-json`` job
          # builds ``latest.json`` itself, pointing at the stapled
          # ``igni_aarch64.app.tar.gz`` (v1 renamed this input from
          # ``includeUpdaterJson``).
          uploadUpdaterJson: false

      # Submit the signed .app to Apple's notarization service
      # ourselves, with per-30s status logging. Replaces the
      # ``tauri-action`` --wait flow that produced 30+ min of dead
      # silence under load. After Apple accepts, staple the ticket
      # to the .app so first-launch on offline machines still
      # passes Gatekeeper, then regenerate ``.app.tar.gz`` from the
      # stapled .app — the updater payload must include the staple
      # for offline-update verification to work. The stale
      # ``.app.tar.gz.sig`` produced by tauri-bundler against the
      # pre-staple tarball is deleted so the next step's fallback
      # re-mints it via minisign against the new tarball.
      - name: Notarize + staple .app (macOS)
        if: matrix.platform == 'macos-26'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 180 min ceiling: notarize times across rc.3+rc.4 for this
        # not-yet-warmed-up Developer ID landed at 70 / 70+ / 51 /
        # 110+ minutes — wildly variable, with no apparent pattern.
        # Once Apple has Accepted a handful of submissions from a
        # given Dev ID the typical review drops to 2-10 min, but
        # until then we have to pay the cold-start tax. Above 3h
        # something is genuinely wrong on Apple's side.
        timeout-minutes: 180
        run: |
          set -euo pipefail
          APP=$(find clients/tauri/src-tauri/target -maxdepth 8 -path '*release/bundle/macos*' -name 'igni.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::igni.app not found"
            find clients/tauri/src-tauri/target -path '*/release/bundle/macos/*' -maxdepth 8 -print || true
            exit 1
          fi
          echo "App bundle: $APP"

          # Build a notarization-submission zip via ditto (Apple's
          # documented tool — preserves the bundle layout / symlinks
          # / xattrs correctly; plain ``zip`` mangles them).
          SUBMIT_ZIP="$RUNNER_TEMP/ember-code-submit.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$SUBMIT_ZIP"
          echo "Submission zip: $(ls -la "$SUBMIT_ZIP")"

          # Submit without --wait so we get the UUID immediately.
          SUBMIT_JSON=$(xcrun notarytool submit "$SUBMIT_ZIP" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --output-format json --no-wait)
          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r '.id // empty')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "::error::no submission id returned"
            echo "$SUBMIT_JSON"
            exit 1
          fi
          echo "Submission id: $SUBMISSION_ID"

          # Poll status; log [Xm Ys] status every interval so the
          # log grows visibly even if Apple is slow. 30s matches
          # Apple's documented notarization status cadence.
          INTERVAL=30
          DEADLINE=$((SECONDS + 170 * 60))  # 170 min, under 180 min step timeout
          STATUS=
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            INFO_JSON=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>/dev/null || true)
            STATUS=$(echo "$INFO_JSON" | jq -r '.status // "Unknown"')
            printf '[%dm %02ds] notarytool status: %s\n' "$((SECONDS/60))" "$((SECONDS%60))" "$STATUS"
            case "$STATUS" in
              Accepted)         break ;;
              Invalid|Rejected) break ;;
              *)                sleep "$INTERVAL" ;;
            esac
          done

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization ended with status: $STATUS"
            echo "::group::notarytool log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::endgroup::"
            exit 1
          fi

          # Staple the ticket into the .app so it works offline.
          xcrun stapler staple "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=1 "$APP"
          /usr/sbin/spctl --assess --type execute --verbose=1 "$APP"

          # Regenerate the updater tarball from the *stapled* .app.
          # tauri-bundler writes the .tar.gz alongside the .app at
          # ``bundle/macos/igni_<arch>.app.tar.gz``; the suffix
          # depends on the cargo --target, so rather than reconstruct
          # we just find the existing one, blow it away, and re-emit
          # using the same name. The companion ``.sig`` is also
          # nuked so the next step's fallback path re-mints it via
          # minisign against the new bytes.
          OLD_TARBALL=$(find clients/tauri/src-tauri/target -name '*.app.tar.gz' -not -path '*.app/*' -print -quit || true)
          if [ -n "$OLD_TARBALL" ]; then
            echo "Regenerating tarball: $OLD_TARBALL"
            # The .app and the tarball live in the same directory
            # (``…/release/bundle/macos/``), so cd there and use
            # bare basenames — the subshell cwd makes that
            # unambiguous, and we sidestep the relative-path-after-
            # cd footgun that failed v0.7.0-rc.2.
            APP_DIR=$(dirname "$APP")
            TARBALL_BASE=$(basename "$OLD_TARBALL")
            ( cd "$APP_DIR" && tar -czf "$TARBALL_BASE" "$(basename "$APP")" )
            rm -f "${OLD_TARBALL}.sig" "${OLD_TARBALL}.minisig"
            ls -la "$OLD_TARBALL"
          else
            echo "::warning::no existing .app.tar.gz found; updater payload may be missing"
          fi

          # The .app inside the .dmg also needs to be the stapled
          # version. Re-upload the DMG too; that happens in the
          # existing "Strip DMG volume icon" step which re-builds
          # and re-uploads via gh release upload --clobber.

          # Replace the .app.tar.gz that tauri-action uploaded with
          # the stapled version. tauri-bundler emits the tarball
          # locally as ``<productName>.app.tar.gz`` (no arch suffix),
          # but tauri-action RENAMES it to
          # ``<productName>_<arch>.app.tar.gz`` (``_aarch64`` — the only Mac build)
          # when uploading to the release — and ``latest.json`` URLs
          # point at the arch-suffixed names. So if we upload the
          # bare basename we publish a new ``igni.app.tar.gz`` asset
          # and leave the OLD pre-staple ``igni_<arch>.app.tar.gz``
          # asset untouched. The updater fetches the arch-suffixed
          # (pre-staple) bytes and verification against our
          # post-staple signature fails. Use ``file#displayName`` to
          # clobber the right asset.
          #
          # IMPORTANT: reuse ``$OLD_TARBALL`` here instead of doing
          # a second ``find`` — the v0.7.2 dry run hit a case where
          # the post-tar find returned empty (race / FS state
          # between the two find calls), the if-block silently
          # skipped, the release kept the pre-staple bytes, and the
          # updater broke. Same variable means same file means no
          # divergence path.
          if [ -n "$OLD_TARBALL" ]; then
            REMOTE_NAME="igni_aarch64.app.tar.gz"
            # ``gh release upload "file#displayName"`` only sets the
            # label in the UI — the asset's actual filename / URL
            # uses the local basename. So we have to RENAME the file
            # on disk first, then upload. v0.7.3 hit this exact bug:
            # the upload created a brand-new ``igni.app.tar.gz``
            # asset with the stapled bytes while
            # ``igni_<arch>.app.tar.gz`` (which ``latest.json``
            # points at) stayed as tauri-action's pre-staple upload.
            STAGED="$RUNNER_TEMP/${REMOTE_NAME}"
            # Whatever name tauri-action uploaded the pre-staple tarball
            # and its .sig under (v0 renamed it ``igni_<arch>``; v1 keeps
            # Tauri CLI's own name), remove it: the release must carry
            # only the stapled tarball, under the name latest.json uses,
            # and nothing un-notarized for SHA256SUMS to count.
            gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
              | { grep -E '\.app\.tar\.gz(\.sig)?$' || true; } \
              | while read -r asset; do
                  [ "$asset" = "$REMOTE_NAME" ] && continue
                  echo "  removing tauri-action's pre-staple asset: $asset"
                  gh release delete-asset "${{ github.ref_name }}" "$asset" --yes --repo "$GITHUB_REPOSITORY"
                done
            cp "$OLD_TARBALL" "$STAGED"
            echo "Re-uploading stapled tarball: $STAGED (renamed from $OLD_TARBALL)"
            ls -la "$STAGED"
            gh release upload "${{ github.ref_name }}" "$STAGED" --clobber --repo "$GITHUB_REPOSITORY"
            echo "  ✓ uploaded as ${REMOTE_NAME}"
          else
            echo "::error::OLD_TARBALL is empty — regen step didn't find a tarball; updater payload will be stale"
            exit 1
          fi

      # Stash IMMEDIATELY after tauri-action — before any other step
      # touches the bundle dir. Probe runs on the ``fix/updater-
      # resign`` branch confirmed that with ``createUpdaterArtifacts
      # : true`` in tauri.conf.json the ``.app.tar.gz.sig`` is on
      # disk right after the action, but earlier release runs found
      # it missing later in the job — likely because tauri-action's
      # upload-to-release step (which only runs when ``tagName`` +
      # ``releaseId`` are supplied, as they are here) cleans up the
      # source files. Grab it now while it's still there.
      #
      # The .sig content tauri-bundler writes is the standard
      # minisign signature *base64-encoded* — that's what Tauri's
      # updater client expects to read out of ``latest.json``'s
      # ``signature`` field. ``updater-json`` below embeds the
      # file's contents verbatim.
      - name: Stash updater signature (macOS)
        if: matrix.platform == 'macos-26'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/updater-sig
          SIG=$(find clients/tauri/src-tauri/target -name '*.app.tar.gz.sig' -print -quit)
          if [ -n "$SIG" ]; then
            # Happy path: tauri-bundler's .sig is still on disk —
            # stash it verbatim (it's already the base64-wrapped
            # form ``latest.json`` needs).
            echo "Found tauri-bundler sig: $SIG"
            cp "$SIG" /tmp/updater-sig/updater.sig
          else
            # Fallback: tauri-action's upload step deleted the .sig
            # before we could grab it (this is what bit v0.6.3).
            # Re-sign the .app.tar.gz with minisign using the same
            # secret key, then base64-encode to match Tauri's
            # expected format. Verified path on ``fix/updater-
            # resign`` test runs.
            TARBALL=$(find clients/tauri/src-tauri/target -name '*.app.tar.gz' -not -path '*.app/*' -print -quit)
            if [ -z "$TARBALL" ]; then
              echo "::error::Neither .sig nor .app.tar.gz present — tauri-bundler didn't produce updater artifacts"
              find clients/tauri/src-tauri/target -path '*/release/bundle/macos/*' -maxdepth 8 -print || true
              exit 1
            fi
            echo "tauri-bundler .sig missing; re-signing $TARBALL with minisign"
            brew install minisign
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/priv.key
            rm -f "${TARBALL}.minisig"
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | \
              minisign -S -s /tmp/priv.key -m "$TARBALL" -W
            # Wrap the raw minisign signature in base64 — that's the
            # format Tauri's updater client expects out of latest.json.
            base64 < "${TARBALL}.minisig" | tr -d '\n' > /tmp/updater-sig/updater.sig
            rm -f /tmp/priv.key
          fi
          ls -la /tmp/updater-sig/
      - name: Upload updater signature artifact
        if: matrix.platform == 'macos-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-sig-aarch64
          path: /tmp/updater-sig/updater.sig
          if-no-files-found: error
          retention-days: 1

      # The .dmg's Finder icon defaults to the bundled app icon
      # (Tauri copies icon.icns into the volume as .VolumeIcon.icns).
      # Strip it so the downloaded .dmg shows the generic disk-image
      # look that users expect for an installer. Re-upload with
      # ``--clobber`` to replace what tauri-action just uploaded.
      # The .app.tar.gz updater payload (separately signed) is
      # untouched, so the auto-updater chain stays valid.
      - name: Strip DMG volume icon (macOS)
        if: matrix.platform == 'macos-26'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in clients/tauri/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            clients/tauri/scripts/strip-dmg-volume-icon.sh "$dmg"
            gh release upload "${{ github.ref_name }}" "$dmg" --clobber
          done

  # Build ``latest.json`` ourselves and attach it to the release —
  # see the long comment in the matrix step above. Mac-only for now;
  # Windows + Linux updaters use different bundle types we don't
  # currently ship signed payloads for.
  updater-json:
    needs: [prepare-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS updater signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-sig-*
          path: /tmp/sigs/
      - name: Assemble + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Strip leading "v" so ``version`` matches what the
          # updater plugin compares against ``CARGO_PKG_VERSION``.
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # The macOS matrix leg copied its ``.app.tar.gz.sig`` to
          # ``/tmp/updater-sig/updater.sig`` before uploading the
          # artifact, so the filename inside each download dir is
          # the stable ``updater.sig`` (no space-in-filename glob
          # surprises like the v0.6.2 attempt hit).
          AARCH64_SIG="$(cat /tmp/sigs/updater-sig-aarch64/updater.sig)"

          # ``jq -Rs .`` reads the file content as a raw string and
          # JSON-quotes it (escapes newlines / quotes correctly).
          AARCH64_JSON="$(printf '%s' "$AARCH64_SIG" | jq -Rs .)"

          # tauri-bundler emits ``<productName>_<arch>.app.tar.gz`` —
          # productName is ``igni`` per tauri.conf.json, so the asset
          # is ``igni_aarch64.app.tar.gz`` (Apple Silicon only; no Intel build).
          # (Pre-rename builds at v0.6.x used ``Ember.Code_<arch>...``;
          # spaces in the old productName became dots in the
          # filename. Bumping ``productName`` in tauri.conf.json
          # changes this output; the URLs below must follow.)
          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the GitHub release page for the changelog.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": ${AARCH64_JSON},
                "url": "${BASE_URL}/igni_aarch64.app.tar.gz"
              }
            }
          }
          EOF
          # Sanity-check the JSON before we ship it.
          jq . /tmp/latest.json >/dev/null
          # ``--repo`` is required because this job doesn't check out
          # the repo (no .git), so ``gh`` can't detect the upstream.
          gh release upload "$TAG" /tmp/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "latest.json uploaded:"
          cat /tmp/latest.json

  # SBOMs, checksums, provenance and (once the key exists) a signature,
  # for every file this release ships — before the draft is published, so
  # a release is never public without them. docs/VERIFYING_RELEASES.md is
  # the user's side of this job.
  #
  # One SHA256SUMS covers everything: the desktop installers and updater
  # payload already on the draft, and the SBOM. Provenance is minted for
  # every line of it in one attestation, and the cosign signature is over
  # it too, so one signed file vouches for every other.
  release-evidence:
    needs: [prepare-release, build-tauri, updater-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # read the draft's assets, attach the evidence
      id-token: write      # Sigstore certificate for the attestation
      attestations: write  # store it on this repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # By release ID, not tag: a draft cannot be looked up by its tag
      # (see github-release below). Evidence from an earlier attempt of this
      # job is skipped, so a re-run hashes the shipped files only.
      - name: Download the desktop assets from the draft
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in
              SHA256SUMS|SHA256SUMS.sig|*.cdx.json|*.sigstore.json) continue ;;
            esac
            echo "  $name"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "dist/release/${name}"
          done
          ls -la dist/release

      # ── SBOM ─────────────────────────────────────────────────────────
      #
      # From the desktop app's lockfiles: the web UI's npm tree is inside
      # it, plus the Tauri shell's crates. Development dependencies are
      # left out: they do not ship. The backend it installs carries its own
      # SBOM on igni-core's release of the same version.
      - name: Stage the desktop app's lockfiles
        run: |
          set -euo pipefail
          mkdir -p sbom-src/igni-desktop/web sbom-src/igni-desktop/shell
          cp clients/web/package.json clients/web/package-lock.json sbom-src/igni-desktop/web/
          cp clients/tauri/src-tauri/Cargo.toml clients/tauri/src-tauri/Cargo.lock sbom-src/igni-desktop/shell/

      - name: SBOM — desktop app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: sbom-src/igni-desktop
          format: cyclonedx
          output: dist/release/igni-desktop-${{ steps.v.outputs.version }}.cdx.json

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          (cd dist/release && sha256sum -- *) > dist/evidence/SHA256SUMS
          cat dist/evidence/SHA256SUMS
          { echo "### ${TAG}"; echo; echo '```'; cat dist/evidence/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # SLSA build provenance for every file in SHA256SUMS, signed with a
      # short-lived Sigstore certificate bound to this workflow run and
      # recorded in Sigstore's public transparency log (this repository is
      # public; the log entry says nothing the repository does not).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/evidence/SHA256SUMS

      # The attestation also lives on GitHub (`gh attestation verify`
      # fetches it); attaching the bundle lets a machine with no network
      # verify it with `--bundle` and a trusted root.
      - name: Keep the attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/evidence/igni-${{ steps.v.outputs.version }}.provenance.sigstore.json"

      # ── Signature ────────────────────────────────────────────────────
      #
      # igni server's approach: a cosign key pair, not keyless, so a user
      # needs only the public key to verify, and `--tlog-upload=false`
      # keeps the signature out of the public log. igni server's offline
      # bundle signs its images, not anything this repository publishes, so
      # this is the only signature on these files.
      #
      # The key ceremony has not happened. Until COSIGN_PRIVATE_KEY,
      # COSIGN_PASSWORD (secrets) and COSIGN_PUBLIC_KEY (variable) are all
      # set, the release goes out unsigned and says so; with only some of
      # them set it fails, because that is a mistake rather than a state.
      - name: Is there a signing key?
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${COSIGN_PRIVATE_KEY}" ] || missing+=("secret COSIGN_PRIVATE_KEY")
          [ -n "${COSIGN_PASSWORD}" ] || missing+=("secret COSIGN_PASSWORD")
          [ -n "${COSIGN_PUBLIC_KEY}" ] || missing+=("variable COSIGN_PUBLIC_KEY")
          if [ "${#missing[@]}" -eq 3 ]; then
            echo "::notice title=Unsigned release::No cosign key is configured (the key ceremony has not happened); SHA256SUMS is not signed. Provenance and SBOMs are still attached."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::cosign is half-configured; missing: ${missing[*]}"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: steps.key.outputs.present == 'true'
        with:
          cosign-release: v2.4.1

      - name: Sign SHA256SUMS
        if: steps.key.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature dist/evidence/SHA256SUMS.sig dist/evidence/SHA256SUMS
          printf '%s\n' "${COSIGN_PUBLIC_KEY}" > "${RUNNER_TEMP}/cosign.pub"
          cosign verify-blob --key "${RUNNER_TEMP}/cosign.pub" --insecure-ignore-tlog=true \
            --signature dist/evidence/SHA256SUMS.sig dist/evidence/SHA256SUMS

      # Only what this job adds: the desktop assets are already on the
      # draft.
      - name: Attach to the draft release
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/release/*.cdx.json dist/evidence/*

  github-release:
    needs: [prepare-release, build-tauri, updater-json, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Tag is ``v0.6.0`` / ``v0.6.0-rc.1`` etc. ``pip_version``
          # is the PyPI-installable form (no leading ``v``); previous
          # body used ``${{ github.ref_name }}`` directly, which gave
          # the broken ``pip install ignite-ember==v0.6.0-rc.1`` snippet
          # (pip rejects the ``v`` prefix).
          PIP_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "pip_version=$PIP_VERSION" >> "$GITHUB_OUTPUT"

          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG".."$TAG" -- | head -50)
            # Write multiline output
            {
              echo "body<<RELEASE_EOF"
              echo "$NOTES"
              echo "RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # We target the draft release ``prepare-release`` created at
      # the start of this workflow run, by its explicit ID — NOT by
      # tag. Using ``softprops/action-gh-release`` here used to
      # race with the draft's eventual-consistency lookup, creating
      # a second (empty, published) release with the same tag and
      # then failing to ``finalize`` the original because GitHub
      # rejects ``tag_name`` collisions on PATCH. Using ``gh
      # release`` CLI with the ID we already know avoids the
      # lookup entirely.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Every asset is already on the draft: the Tauri bundles from
          # the build-tauri matrix, latest.json, the evidence from
          # release-evidence.

          # Compose the final body + publish (draft → false). We use
          # the API directly because ``gh release edit`` can't take
          # a release ID; it uses tag, which is fine here since we
          # only have ONE release for this tag (the duplicate-race
          # bug was specific to softprops).
          BODY=$(cat <<'BODY_EOF'
          ${{ steps.notes.outputs.body }}

          ## Install

          **Desktop app:** download the installer for your platform
          (``.dmg``, ``.msi`` or ``.AppImage``) below. On first launch it
          installs igni's backend, ``ignite-ember==${{ steps.notes.outputs.pip_version }}``,
          released from [ignite-ember/igni-core](https://github.com/ignite-ember/igni-core/releases).

          ## Verify

          ``SHA256SUMS`` lists every file on this release. Each one has
          GitHub build provenance (``gh attestation verify <file> --repo
          ${{ github.repository }}``; the bundle is attached for offline
          checks), the ``*.cdx.json`` files are CycloneDX SBOMs, and
          ``SHA256SUMS.sig``, when present, is a cosign signature over the
          checksums. See docs/VERIFYING_RELEASES.md.
          BODY_EOF
          )

          PRERELEASE=${{ contains(github.ref_name, '-') }}
          gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -f name="${{ github.ref_name }}" \
            -f body="$BODY" \
            -F draft=false \
            -F prerelease=$PRERELEASE \
            --jq '{id, name, draft, prerelease, html_url}'

