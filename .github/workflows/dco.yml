name: DCO

# Every commit in a pull request must carry a `Signed-off-by:` line
# (CONTRIBUTING.md, "Developer Certificate of Origin"). Adapted from igni
# server's check; this repository is the public one, so it runs everywhere.
#
# Safe for pull requests from forks: it runs on `pull_request`, never
# `pull_request_target`, so it gets a read-only token and no secrets, and
# it only reads commit messages — it runs nothing from the pull request.
on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  signed-off:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # The last commit made before the check existed. It and its
          # ancestors (feat/extensions' history, one author, unsigned) are
          # not re-checked; every commit after it is.
          SIGNED_OFF_FROM: ae5950868eae46e406b88e4221e24fd1c785c9ac
        run: |
          set -- "${BASE}..${HEAD}"
          if git cat-file -e "${SIGNED_OFF_FROM}^{commit}" 2>/dev/null; then
            set -- "$@" "^${SIGNED_OFF_FROM}"
          fi
          missing=0
          for sha in $(git rev-list --no-merges "$@"); do
            author="$(git log -1 --format='%an <%ae>' "${sha}")"
            if ! git log -1 --format='%B' "${sha}" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::${sha} (${author}) has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Sign off with 'git commit -s', or for a branch: git rebase --signoff ${BASE}"
            exit 1
          fi
          echo "Every commit is signed off."
