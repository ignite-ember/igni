name: Scorecard

# OpenSSF Scorecard: an outside, repeatable score of this repository's
# supply-chain practices — pinned actions, token permissions, branch
# protection, signed releases, a security policy, dependency updates. The
# result is published to scorecard.dev (the README badge reads it) and
# uploaded to code scanning, where each failing check is an alert with the
# remediation beside it.
#
# `publish_results: true` holds this workflow to Scorecard's rules: only
# the actions below, no top-level `env` or `defaults`, no containers, and
# job-level permissions only for the job that publishes. Keep it that way
# or publishing fails.

on:
  # Branch-Protection is re-checked when a rule changes.
  branch_protection_rule:
  schedule:
    # Weekly, Monday 05:30 UTC.
    - cron: "30 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard scores the default branch; nothing else is published.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write  # upload the SARIF to code scanning
      id-token: write         # publish_results: proves the result came from this workflow
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Branch-Protection reads rules the default token cannot see. To score
      # it, create a fine-grained read-only token (Administration: read) as
      # the SCORECARD_TOKEN secret; without it that one check is reported
      # as inconclusive and everything else is scored.
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Keep the SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
