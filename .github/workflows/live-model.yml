name: Live model

# The tests and evals that need a real model, which nothing else runs.
#
# ci.yml never sets IGNI_TEST_LLM_API_KEY, so tests/test_live_agno_loops.py
# and the live half of tests/test_queue_hook.py skip on every push, and the
# eval suites under evals/ run only when someone remembers
# scripts/run_evals_smoke.py by hand. A change that breaks a real tool loop
# against a real model passed CI.
#
# This runs them against any OpenAI-compatible endpoint named by the
# repository's secrets — igni server, vLLM, a hosted API:
#
#   IGNI_TEST_LLM_API_KEY   required; without it the job says so and stops
#   IGNI_TEST_LLM_BASE_URL  the endpoint, e.g. https://igni.acme.example/v1
#                           (OpenAI's API when unset)
#   IGNI_TEST_LLM_MODEL     the model id (gpt-4o-mini when unset)
#
# Weekly and on demand rather than per push: every run costs model time.
# The live tests gate (a red job); the evals report — a pass rate from a
# nondeterministic model is a trend to read, not a check to fail on — and
# their per-case results are uploaded.

on:
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      suites:
        description: "Eval suites (comma-list of names under evals/, or 'all')"
        required: false
        default: "main,editor,debugger"
      cases:
        description: "Cases per suite (0 = all)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IGNI_TEST_LLM_API_KEY: ${{ secrets.IGNI_TEST_LLM_API_KEY }}
      IGNI_TEST_LLM_BASE_URL: ${{ secrets.IGNI_TEST_LLM_BASE_URL }}
      IGNI_TEST_LLM_MODEL: ${{ secrets.IGNI_TEST_LLM_MODEL }}
    steps:
      - name: Is an endpoint configured?
        id: endpoint
        run: |
          if [ -z "${IGNI_TEST_LLM_API_KEY}" ]; then
            echo "::notice title=Live model tests skipped::IGNI_TEST_LLM_API_KEY is not set in this repository's secrets, so the live tests and evals did not run. Set it (and IGNI_TEST_LLM_BASE_URL / IGNI_TEST_LLM_MODEL for an endpoint other than OpenAI's) to run them."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.endpoint.outputs.configured == 'true'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.endpoint.outputs.configured == 'true'
        with:
          python-version-file: .python-version

      - name: Install uv
        if: steps.endpoint.outputs.configured == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        if: steps.endpoint.outputs.configured == 'true'
        run: uv sync --extra dev --extra web

      # The suite runs every test as if inside a customer's network
      # (tests/egress_guard.py). The endpoint is the one host these tests
      # are meant to reach, so it is named as inside; nothing else is.
      - name: Let the endpoint through the test egress guard
        if: steps.endpoint.outputs.configured == 'true'
        run: |
          host=$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ.get("IGNI_TEST_LLM_BASE_URL") or "https://api.openai.com/v1").hostname or "")')
          echo "IGNI_EGRESS_ALLOW_HOSTS=${host}" >> "$GITHUB_ENV"

      # Every test file that reads the key, found rather than listed, so a
      # new live test is picked up without editing this file.
      - name: Live tests
        if: steps.endpoint.outputs.configured == 'true'
        run: |
          mapfile -t files < <(grep -l 'IGNI_TEST_LLM_API_KEY' tests/test_*.py | grep -v test_dormant_tests_are_declared.py)
          echo "Running: ${files[*]}"
          uv run --no-sync pytest "${files[@]}" -q -rs

      - name: Representative evals
        if: steps.endpoint.outputs.configured == 'true' && !cancelled()
        env:
          SUITES: ${{ inputs.suites || 'main,editor,debugger' }}
          CASES: ${{ inputs.cases || '3' }}
        run: |
          uv run --no-sync python scripts/run_evals_smoke.py \
            --suite "${SUITES}" --cases "${CASES}" --case-timeout 300 \
            | tee eval-output.txt
          {
            echo '### Evals'
            echo '```'
            grep -E 'PASS|FAIL|pass rate|passed' eval-output.txt | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval results
        if: steps.endpoint.outputs.configured == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 30
