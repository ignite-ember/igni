name: SDK release

# Publishes igni's SDKs to the public registries:
#
#   PyPI    igni-service, igni-extension
#   npmjs   @ignite-ember/extension-bridge, @ignite-ember/ui-react,
#           @ignite-ember/ui-css
#
# One version for all five, one tag: pushing `sdk-v<version>` (say
# `sdk-v0.2.0`, or `sdk-v0.2.0-rc.1`) publishes that version to PyPI and
# npmjs, then attaches every wheel, sdist and tarball to the GitHub Release
# for the tag, where the offline bundle and air-gapped builds take them
# from. The tag must name the version the manifests already carry —
# `make sdk-version VERSION=…` sets all five — or the release stops
# before building anything.
#
# Run by hand (Actions -> SDK release -> Run workflow), from any branch,
# to rehearse: the Python packages go to TestPyPI, and the npm packages
# are dry-run published and their tarballs kept as a workflow artifact.
# Nothing reaches PyPI or npmjs except from an `sdk-v*` tag.
#
# No publishing credential is stored. PyPI and TestPyPI trust this
# workflow through trusted publishing (OIDC), in the GitHub environments
# `pypi` and `testpypi`; npmjs trusts it the same way, in the environment
# `npm`. npm's trusted publishing is configured per package, on a package
# that already exists, so until the three exist the `npm` environment may
# hold an `NPM_TOKEN` secret for the first publish — used only while it is
# set. Re-running is safe: a file or version already published is skipped,
# not re-uploaded.
#
# docs/PUBLISHING_THE_SDKS.md has the whole procedure, including the
# one-time setup of the registries and environments.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two runs for one ref would race each other's uploads; let the first finish.
concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Check actor is repo admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::SDK releases can only be triggered by repo admins. Actor '$ACTOR' has '$PERMISSION' permission."
            exit 1
          fi

  # Release or rehearsal, and which version. The version comes from the
  # manifests; a tag only has to agree with them.
  resolve:
    name: Resolve
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      npm_dist_tag: ${{ steps.resolve.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag_version=""
          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/tags/sdk-v*) tag_version="${REF#refs/tags/sdk-v}"; mode=release ;;
              *) echo "::error::a push releases only from an sdk-v* tag; '$REF' is not one"; exit 1 ;;
            esac
          else
            mode=rehearsal
          fi

          # Fails, listing every manifest, when they disagree with each
          # other or with the tag.
          version=$(make --no-print-directory sdk-version-check VERSION="$tag_version" | tail -n 1 | sed 's/^SDK version //')

          # A pre-release must not become what `npm install @ignite-ember/…`
          # picks. PyPI needs nothing: uv and pip skip pre-releases unless
          # asked.
          case "$version" in
            *-*) npm_dist_tag=next;   prerelease=true ;;
            *)   npm_dist_tag=latest; prerelease=false ;;
          esac

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "npm_dist_tag=$npm_dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "SDK $version: $mode (npm dist-tag \`$npm_dist_tag\`)" >> "$GITHUB_STEP_SUMMARY"

  # The checks the packages' own CI jobs run (ci.yml `packages` and `web`),
  # on the commit being released. Not the whole of ci.yml: the desktop and
  # browser suites test igni, not its SDKs, and must not hold one up.
  verify-python:
    name: Verify Python SDKs
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Lint, type-check and test the SDKs
        run: make packages-check

  # @ignite-ember/ui-react's and @ignite-ember/extension-bridge's tests run
  # in clients/web, whose vitest and tsconfig include packages/.
  verify-npm:
    name: Verify npm SDKs
    needs: authorize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build wheels, sdists and npm tarballs
        run: make sdk-build

      # What PyPI would refuse (a README it cannot render, metadata it
      # cannot read), refused here, before anything is uploaded anywhere.
      - name: Check the Python distributions
        run: uvx twine check --strict dist/sdk/python/*

      # A CycloneDX SBOM per Python SDK, from its own uv.lock: every extra,
      # no development group. The npm packages declare no dependencies
      # (ui-react's are peers, the application's to choose), so an SBOM of
      # one would list only itself; npm's provenance covers them instead.
      - name: SBOMs
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/sdk/sbom
          for pkg in igni-service igni-extension; do
            uv export --frozen --directory "packages/$pkg" --no-dev --all-extras \
              --format cyclonedx1.5 --preview-features sbom-export \
              -o "$PWD/dist/sdk/sbom/$pkg-$VERSION.cdx.json"
          done

      - name: Checksums, and what each tarball carries
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          { (cd dist/sdk/python && sha256sum -- *); (cd dist/sdk/npm && sha256sum -- *.tgz); (cd dist/sdk/sbom && sha256sum -- *); } > dist/sdk/SHA256SUMS
          cat dist/sdk/SHA256SUMS
          {
            echo "### SDK $VERSION"
            echo
            echo '```'
            cat dist/sdk/SHA256SUMS
            echo '```'
            for f in dist/sdk/npm/*.tgz; do
              echo; echo "<details><summary>${f##*/}</summary>"; echo; echo '```'
              tar -tzf "$f" | sort
              echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk
          retention-days: 30
          if-no-files-found: error

  # ── Rehearsal: a manual run ──────────────────────────────────────────

  testpypi:
    name: Rehearse on TestPyPI
    if: needs.resolve.outputs.mode == 'rehearsal'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/igni-service/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # TestPyPI, like PyPI, never takes the same file twice, so a second
      # rehearsal of one version uploads nothing: rehearse changed code
      # under a new pre-release version.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/sdk/python/
          skip-existing: true

  npm-rehearsal:
    name: Rehearse npm (dry run)
    if: needs.resolve.outputs.mode == 'rehearsal'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Everything `npm publish` does but the upload, under the dist-tag a
      # release would use: it reads the tarball, checks the manifest and
      # lists what would be published.
      - name: npm publish --dry-run
        env:
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          for tarball in dist/sdk/npm/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::warning::$name@$version is already on npmjs; a release of this version would skip it"
            fi
            npm publish "$tarball" --dry-run --provenance --access public --tag "$DIST_TAG"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs-${{ needs.resolve.outputs.version }}
          path: dist/sdk/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  # ── Release: an sdk-v* tag ────────────────────────────────────────────
  #
  # Give `pypi` and `npm` the same required reviewer: both jobs then wait
  # together and one review approves the release.

  pypi:
    name: Publish to PyPI
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/igni-service/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/sdk/python/
          skip-existing: true

  npm:
    name: Publish to npmjs
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/ignite-ember
    permissions:
      id-token: write  # trusted publishing, and provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Publish
        env:
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
          # Only for the first publish, before trusted publishing can be
          # configured on the packages. Once it is, delete the secret: npm
          # then signs in with this job's OIDC token alone.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm --version
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::publishing with the NPM_TOKEN secret; configure trusted publishing and delete it"
            npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
          fi
          for tarball in dist/sdk/npm/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
            fi
          done

  github-release:
    name: Attach to the GitHub Release
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore certificate for the attestation
      attestations: write  # store it on this repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # Build provenance for every file in SHA256SUMS — wheels, sdists, npm
      # tarballs, SBOMs — in one attestation, bound to this run. Only on a
      # release: a rehearsal's files are not published, and attesting them
      # would put provenance on bytes nobody ships. PyPI and npm carry
      # their own attestations too (trusted publishing, `--provenance`);
      # this one covers the copies on the GitHub Release, which are what an
      # air-gapped build takes. docs/VERIFYING_RELEASES.md.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/sdk/SHA256SUMS

      - name: Keep the attestation bundle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/sdk/igni-sdk-$VERSION.provenance.sigstore.json"

      # A cosign signature over SHA256SUMS, as release.yml does for igni
      # itself — a key pair and `--tlog-upload=false`, igni server's
      # approach. Skipped, with a notice, until the key ceremony has put
      # COSIGN_PRIVATE_KEY, COSIGN_PASSWORD and COSIGN_PUBLIC_KEY in place.
      - name: Is there a signing key?
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${COSIGN_PRIVATE_KEY}" ] || missing+=("secret COSIGN_PRIVATE_KEY")
          [ -n "${COSIGN_PASSWORD}" ] || missing+=("secret COSIGN_PASSWORD")
          [ -n "${COSIGN_PUBLIC_KEY}" ] || missing+=("variable COSIGN_PUBLIC_KEY")
          if [ "${#missing[@]}" -eq 3 ]; then
            echo "::notice title=Unsigned release::No cosign key is configured (the key ceremony has not happened); SHA256SUMS is not signed. Provenance and SBOMs are still attached."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::cosign is half-configured; missing: ${missing[*]}"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: steps.key.outputs.present == 'true'
        with:
          cosign-release: v2.4.1

      - name: Sign SHA256SUMS
        if: steps.key.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature dist/sdk/SHA256SUMS.sig dist/sdk/SHA256SUMS
          printf '%s\n' "${COSIGN_PUBLIC_KEY}" > "${RUNNER_TEMP}/cosign.pub"
          cosign verify-blob --key "${RUNNER_TEMP}/cosign.pub" --insecure-ignore-tlog=true \
            --signature dist/sdk/SHA256SUMS.sig dist/sdk/SHA256SUMS

      # Created when missing, its files replaced when re-run. Never marked
      # latest: the desktop app's updater reads `releases/latest`, which
      # must stay igni's own `v*` release.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            flags=(--latest=false)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$REPO" --verify-tag "${flags[@]}" \
              --title "SDK $VERSION" \
              --notes "igni SDK $VERSION: \`igni-service\` and \`igni-extension\` on PyPI; \`@ignite-ember/extension-bridge\`, \`@ignite-ember/ui-react\` and \`@ignite-ember/ui-css\` on npmjs. The files below are the same bytes, for builds that cannot reach either registry; SHA256SUMS lists their digests, every file has GitHub build provenance (the bundle is attached for offline checks), the *.cdx.json files are CycloneDX SBOMs, and SHA256SUMS.sig, when present, is a cosign signature. See docs/VERIFYING_RELEASES.md."
          fi
          shopt -s nullglob
          gh release upload "$TAG" --repo "$REPO" --clobber \
            dist/sdk/python/* dist/sdk/npm/*.tgz dist/sdk/sbom/*.cdx.json \
            dist/sdk/SHA256SUMS dist/sdk/SHA256SUMS.sig dist/sdk/*.provenance.sigstore.json
          {
            echo "### SDK $VERSION released"
            echo
            echo "- PyPI: https://pypi.org/project/igni-service/ and https://pypi.org/project/igni-extension/"
            echo "- npmjs: https://www.npmjs.com/org/ignite-ember (dist-tag \`$DIST_TAG\`)"
            echo "- GitHub Release: https://github.com/$REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
