name: SDK release

# Publishes igni's SDKs to the public registries:
#
#   PyPI    igni-service, igni-extension
#   npmjs   @ignite-ember/extension-bridge, @ignite-ember/ui-react,
#           @ignite-ember/ui-css
#
# One version for all five, one tag: pushing `sdk-v<version>` (say
# `sdk-v0.2.0`, or `sdk-v0.2.0-rc.1`) publishes that version to PyPI and
# npmjs, then attaches every wheel, sdist and tarball to the GitHub Release
# for the tag, where the offline bundle and air-gapped builds take them
# from. The tag must name the version the manifests already carry —
# `make sdk-version VERSION=…` sets all five — or the release stops
# before building anything.
#
# Run by hand (Actions -> SDK release -> Run workflow), from any branch,
# to rehearse: the Python packages go to TestPyPI, and the npm packages
# are dry-run published and their tarballs kept as a workflow artifact.
# Nothing reaches PyPI or npmjs except from an `sdk-v*` tag.
#
# No publishing credential is stored. PyPI and TestPyPI trust this
# workflow through trusted publishing (OIDC), in the GitHub environments
# `pypi` and `testpypi`; npmjs trusts it the same way, in the environment
# `npm`. npm's trusted publishing is configured per package, on a package
# that already exists, so until the three exist the `npm` environment may
# hold an `NPM_TOKEN` secret for the first publish — used only while it is
# set. Re-running is safe: a file or version already published is skipped,
# not re-uploaded.
#
# docs/PUBLISHING_THE_SDKS.md has the whole procedure, including the
# one-time setup of the registries and environments.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two runs for one ref would race each other's uploads; let the first finish.
concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Check actor is repo admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::SDK releases can only be triggered by repo admins. Actor '$ACTOR' has '$PERMISSION' permission."
            exit 1
          fi

  # Release or rehearsal, and which version. The version comes from the
  # manifests; a tag only has to agree with them.
  resolve:
    name: Resolve
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      npm_dist_tag: ${{ steps.resolve.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag_version=""
          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/tags/sdk-v*) tag_version="${REF#refs/tags/sdk-v}"; mode=release ;;
              *) echo "::error::a push releases only from an sdk-v* tag; '$REF' is not one"; exit 1 ;;
            esac
          else
            mode=rehearsal
          fi

          # Fails, listing every manifest, when they disagree with each
          # other or with the tag.
          version=$(make --no-print-directory sdk-version-check VERSION="$tag_version" | tail -n 1 | sed 's/^SDK version //')

          # A pre-release must not become what `npm install @ignite-ember/…`
          # picks. PyPI needs nothing: uv and pip skip pre-releases unless
          # asked.
          case "$version" in
            *-*) npm_dist_tag=next;   prerelease=true ;;
            *)   npm_dist_tag=latest; prerelease=false ;;
          esac

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "npm_dist_tag=$npm_dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "SDK $version: $mode (npm dist-tag \`$npm_dist_tag\`)" >> "$GITHUB_STEP_SUMMARY"

  # The checks the packages' own CI jobs run (ci.yml `packages` and `web`),
  # on the commit being released. Not the whole of ci.yml: the desktop and
  # browser suites test igni, not its SDKs, and must not hold one up.
  verify-python:
    name: Verify Python SDKs
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint, type-check and test the SDKs
        run: make packages-check

  # @ignite-ember/ui-react's and @ignite-ember/extension-bridge's tests run
  # in clients/web, whose vitest and tsconfig include packages/.
  verify-npm:
    name: Verify npm SDKs
    needs: authorize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build wheels, sdists and npm tarballs
        run: make sdk-build

      # What PyPI would refuse (a README it cannot render, metadata it
      # cannot read), refused here, before anything is uploaded anywhere.
      - name: Check the Python distributions
        run: uvx twine check --strict dist/sdk/python/*

      - name: Checksums, and what each tarball carries
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          { (cd dist/sdk/python && sha256sum -- *); (cd dist/sdk/npm && sha256sum -- *.tgz); } > dist/sdk/SHA256SUMS
          cat dist/sdk/SHA256SUMS
          {
            echo "### SDK $VERSION"
            echo
            echo '```'
            cat dist/sdk/SHA256SUMS
            echo '```'
            for f in dist/sdk/npm/*.tgz; do
              echo; echo "<details><summary>${f##*/}</summary>"; echo; echo '```'
              tar -tzf "$f" | sort
              echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk
          retention-days: 30
          if-no-files-found: error

  # ── Rehearsal: a manual run ──────────────────────────────────────────

  testpypi:
    name: Rehearse on TestPyPI
    if: needs.resolve.outputs.mode == 'rehearsal'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/igni-service/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # TestPyPI, like PyPI, never takes the same file twice, so a second
      # rehearsal of one version uploads nothing: rehearse changed code
      # under a new pre-release version.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/sdk/python/
          skip-existing: true

  npm-rehearsal:
    name: Rehearse npm (dry run)
    if: needs.resolve.outputs.mode == 'rehearsal'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Everything `npm publish` does but the upload, under the dist-tag a
      # release would use: it reads the tarball, checks the manifest and
      # lists what would be published.
      - name: npm publish --dry-run
        env:
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          for tarball in dist/sdk/npm/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::warning::$name@$version is already on npmjs; a release of this version would skip it"
            fi
            npm publish "$tarball" --dry-run --provenance --access public --tag "$DIST_TAG"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ needs.resolve.outputs.version }}
          path: dist/sdk/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  # ── Release: an sdk-v* tag ────────────────────────────────────────────
  #
  # Give `pypi` and `npm` the same required reviewer: both jobs then wait
  # together and one review approves the release.

  pypi:
    name: Publish to PyPI
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/igni-service/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk/python/
          skip-existing: true

  npm:
    name: Publish to npmjs
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, verify-python, verify-npm, build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/ignite-ember
    permissions:
      id-token: write  # trusted publishing, and provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish
        env:
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
          # Only for the first publish, before trusted publishing can be
          # configured on the packages. Once it is, delete the secret: npm
          # then signs in with this job's OIDC token alone.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm --version
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::publishing with the NPM_TOKEN secret; configure trusted publishing and delete it"
            npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
          fi
          for tarball in dist/sdk/npm/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
            fi
          done

  github-release:
    name: Attach to the GitHub Release
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.resolve.outputs.version }}
          path: dist/sdk

      # Created when missing, its files replaced when re-run. Never marked
      # latest: the desktop app's updater reads `releases/latest`, which
      # must stay igni's own `v*` release.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          DIST_TAG: ${{ needs.resolve.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            flags=(--latest=false)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$REPO" --verify-tag "${flags[@]}" \
              --title "SDK $VERSION" \
              --notes "igni SDK $VERSION: \`igni-service\` and \`igni-extension\` on PyPI; \`@ignite-ember/extension-bridge\`, \`@ignite-ember/ui-react\` and \`@ignite-ember/ui-css\` on npmjs. The files below are the same bytes, for builds that cannot reach either registry; SHA256SUMS lists their digests."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber \
            dist/sdk/python/* dist/sdk/npm/*.tgz dist/sdk/SHA256SUMS
          {
            echo "### SDK $VERSION released"
            echo
            echo "- PyPI: https://pypi.org/project/igni-service/ and https://pypi.org/project/igni-extension/"
            echo "- npmjs: https://www.npmjs.com/org/ignite-ember (dist-tag \`$DIST_TAG\`)"
            echo "- GitHub Release: https://github.com/$REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
