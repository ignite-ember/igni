[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igni-service"
version = "0.1.0"
description = "What a service needs to be part of an igni deployment: its own key, registration, people's tokens, the directory, notifications, erasure and export, and its extension bundle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Ignite Ember" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    # RS256 tokens, client assertions and the bundle's JWS. PyJWT rather
    # than python-jose: maintained, and its `crypto` extra is the same
    # `cryptography` the key itself is made with.
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",
    # The key store (`igni_service.sql_keystore`). Async because every
    # service this is for is.
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
]

[project.scripts]
igni-service-bundle = "igni_service.bundle:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22",
    "ruff>=0.15",
    "mypy>=1.19",
    # The bundle builder downloads wheels with pip; a uv-made venv seeds none.
    "pip>=25",
    # The bundle tests build their tiny packages with no network, which
    # means without build isolation, which means the backend is here.
    "hatchling>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igni_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` as a default is how FastAPI is written, and how a service
# author writes `person: Person = Depends(igni.person)`.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["igni_service", "tests"]
