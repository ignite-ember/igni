[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igni-extension"
version = "0.1.0"
description = "What an igni extension's process needs: tools over MCP, its own service with the person's token, and the host's object model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Ignite Ember" }]
keywords = ["igni", "extension", "mcp", "sdk", "air-gapped"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # FastMCP is MCPServer in 2.x, and the session hook in
    # `igni_extension.session` reads 1.x's lowlevel server.
    "mcp>=1.30,<2",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "anyio>=4",
    # The host object model's socket (`ext.host`) and `ext.service.websocket`.
    "websockets>=15,<17",
]

[project.urls]
Homepage = "https://github.com/ignite-ember/igni"
Documentation = "https://github.com/ignite-ember/igni/tree/main/packages/igni-extension#readme"
Source = "https://github.com/ignite-ember/igni/tree/main/packages/igni-extension"
Issues = "https://github.com/ignite-ember/igni/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15",
    "mypy>=1.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igni_extension"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Generated from igni's host schema; `make host-sdks` in igni writes it
# and a test there checks it is current.
extend-exclude = ["src/igni_extension/host_model.py"]

[tool.ruff.lint]
# ``S`` is flake8-bandit (security lint), as in igni's own pyproject: a
# finding is fixed or carries a ``# noqa: S…`` saying why it is not one.
# ``S101`` (assert) is off for the reason given there.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# Fake tokens are fixtures; the processes tests start are fixed argv lists.
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["igni_extension", "tests"]
