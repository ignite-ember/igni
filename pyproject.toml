[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ignite-ember"
version = "1.0.3"
description = "AI coding assistant with multi-agent orchestration — TUI, web, JetBrains, VSCode, and Tauri clients"
readme = "README.md"
license = "Apache-2.0"
# 3.12 exactly, not a floor. The desktop app installs 3.12 and only
# 3.12 (``clients/tauri/src-tauri/src/runtime.rs``), and the failure
# mode off that version is silent rather than loud: on 3.14 the Neo4j
# sidecar dies without writing stderr or a log, and the knowledge base
# simply never comes up. A range here would let a contributor's
# ``uv sync`` pick an interpreter the product never ships on.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ignite Ember" }]
keywords = ["ai", "coding-assistant", "agent", "agno", "claude", "openai", "tui", "jetbrains"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    # One classifier, because one version is supported. Listing 3.11 and
    # 3.13 told PyPI — and anyone reading the package page — that this
    # installs and runs there. It does not: the desktop app ships 3.12,
    # and off-version the Neo4j sidecar fails silently.
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]

# Tight ``~=X.Y.Z`` pins (PEP 440 "compatible release", which expands
# to ``>= X.Y.Z, < X.(Y+1).0``). Any minor-version bump from an
# upstream package goes through an explicit ember-code release, not
# through pip's resolver. Stops repeats of the v0.5.2 incident where
# ``textual~=8.1`` quietly let 8.2.7 install and the renamed theme
# ``textual-ansi`` → ``ansi-dark`` silently bricked the TUI.
dependencies = [
    "agno[openai,ddg,sqlite,sql,mcp]~=2.6.12",
    "aiosqlite~=0.22.1",
    "sqlalchemy[asyncio]~=2.0.50",
    "alembic~=1.18.4",
    "greenlet~=3.5.1",
    "rich~=15.0.0",
    "textual~=8.2.7",
    "pyyaml~=6.0.3",
    "click~=8.4.1",
    "pydantic~=2.13.4",
    "httpx~=0.28.1",
    "google-genai~=2.8.0",
    "tokenizers~=0.22.2",
    "tiktoken~=0.13.0",
    "ripgrep~=15.1.0",
    "beautifulsoup4~=4.15.0",
    "pypdf~=6.15.0",
    "python-docx~=1.2.0",
    "python-pptx~=1.0.2",
    "openpyxl~=3.1.5",
    "aiofiles~=25.1.0",
    "youtube_transcript_api~=1.2.4",
    "arxiv~=4.0.0",
    "wikipedia~=1.4.0",
    "dateparser~=1.4.0",
    "sentence-transformers~=5.5.1",
    "websockets~=16.0",
    "neo4j~=5.27.0",
]

[project.urls]
Homepage = "https://ignite-ember.sh"
Repository = "https://github.com/ignite-ember/igni"
Issues = "https://github.com/ignite-ember/igni/issues"
Changelog = "https://github.com/ignite-ember/igni/releases"

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "ruff~=0.15.6",
    "mypy~=1.19.1",
    "python-dotenv~=1.2.2",
]
mcp = [
    "mcp~=1.28.1",
]
gemini = [
    "google-genai~=2.8.0",
]
web = [
    "duckduckgo-search~=8.1",
]

[project.scripts]
# ``ignite-ember`` kept for backwards compatibility — existing user
# shell aliases / docs / scripts continue to work. ``igni`` is the
# canonical command going forward; both point at the same entrypoint.
ignite-ember = "ember_code.__main__:main"
igni = "ember_code.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ember_code"]

# The sdist otherwise includes everything git does not ignore, which
# makes a release build depend on how tidy the working tree happens to
# be. A stray virtualenv is the concrete failure: its `bin/python` is an
# absolute symlink, and tarfile refuses it, so `python -m build` dies
# rather than shipping something wrong.
[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv*",
  "/.git",
  "/clients",
  "/evals",
  "/scripts",
  "/docs",
  "/.github",
  "/.pytest_cache",
  "/.mypy_cache",
  "/.ruff_cache",
  "**/__pycache__",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Deliberately behind ``requires-python``. Raising this to py312 is not
# part of pinning the interpreter — it unlocks 87 pyupgrade findings
# (``datetime.UTC``, ``StrEnum``, bare ``TimeoutError``) across the
# codebase, which is a modernisation sweep that deserves its own change
# rather than riding along inside a version pin.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# ``target-version`` is py310 (see above), which predates ``tomllib``,
# so isort would file a stdlib import under third-party and sort it
# next to pytest. Stating it here keeps the grouping honest without
# dragging in the 87-finding pyupgrade sweep that raising the target
# would.
extra-standard-library = ["tomllib"]

[tool.mypy]
# Matches ``requires-python`` above — the one version this ships on.
# It was 3.11 while the floor was 3.11; type-checking against a version
# the product never runs is how a 3.12-only bug reaches a user green.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["union-attr", "annotation-unchecked", "arg-type", "return-value", "attr-defined", "import-untyped", "call-arg", "override"]

# numpy 2.5 writes ``type X = ...`` in its own stubs, which mypy refuses to
# parse while ``python_version`` is 3.11. It does not report it as one
# skipped dependency either — it aborts with "errors prevented further
# checking", so the whole run checked **zero files** and still exited
# non-zero for a reason that named numpy, not this project.
#
# Skipping numpy's stubs keeps the 3.11 floor above honest. Raising
# ``python_version`` instead would silently stop checking the 3.11
# compatibility the package still claims to support.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
