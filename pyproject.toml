[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ignite-ember"
version = "1.0.3"
description = "AI coding assistant with multi-agent orchestration — TUI, web, JetBrains, VSCode, and Tauri clients"
readme = "README.md"
license = "Apache-2.0"
# 3.12 exactly, not a floor. The desktop app installs 3.12 and only
# 3.12 (``clients/tauri/src-tauri/src/runtime.rs``), and the failure
# mode off that version is silent rather than loud: on 3.14 a sidecar
# igni used to run died without writing stderr or a log, and the feature
# behind it simply never came up. A range here would let a contributor's
# ``uv sync`` pick an interpreter the product never ships on.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ignite Ember" }]
keywords = ["ai", "coding-assistant", "agent", "agno", "claude", "openai", "tui", "jetbrains"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    # One classifier, because one version is supported. Listing 3.11 and
    # 3.13 told PyPI — and anyone reading the package page — that this
    # installs and runs there. It does not: the desktop app ships 3.12.
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]

# Tight ``~=X.Y.Z`` pins (PEP 440 "compatible release", which expands
# to ``>= X.Y.Z, < X.(Y+1).0``). Any minor-version bump from an
# upstream package goes through an explicit ember-code release, not
# through pip's resolver. Stops repeats of the v0.5.2 incident where
# ``textual~=8.1`` quietly let 8.2.7 install and the renamed theme
# ``textual-ansi`` → ``ansi-dark`` silently bricked the TUI.
dependencies = [
    "agno[openai,ddg,sqlite,sql,mcp]~=2.6.12",
    "aiosqlite~=0.22.1",
    "sqlalchemy[asyncio]~=2.0.50",
    "alembic~=1.18.4",
    "greenlet~=3.5.1",
    "rich~=15.0.0",
    "textual~=8.2.7",
    "pyyaml~=6.0.3",
    "click~=8.4.1",
    "pydantic~=2.13.4",
    "httpx~=0.28.1",
    "google-genai~=2.8.0",
    "tokenizers~=0.22.2",
    "ripgrep~=15.1.0",
    # Ed25519 verification of extension bundle signatures
    # (``extensions/signature.py``). It was already importable as a
    # transitive dependency, which a security control may not rely on.
    "cryptography~=50.0",
    "aiofiles~=25.1.0",
    # The document readers — pypdf, python-docx, python-pptx, openpyxl,
    # beautifulsoup4, youtube_transcript_api, arxiv, wikipedia — and
    # weasyprint for PDF export were here because the document store
    # lived here. It is the Artifacts extension now, and they are its
    # dependencies: a machine that never installs it never installs a
    # PDF parser. Nothing left in igni imports any of them.
    "dateparser~=1.4.0",
    "websockets~=16.0",
    # Server discovery reads a TXT record in the customer's own zone,
    # for deployments that would rather publish DNS than serve a file
    # at their email domain's web root. Pure Python, no system
    # resolver dependency, and the async resolver matters: a blocking
    # lookup here would hold the sign-in screen.
    "dnspython~=2.8.0",
]

[project.urls]
Homepage = "https://ignite-ember.sh"
Repository = "https://github.com/ignite-ember/igni"
Issues = "https://github.com/ignite-ember/igni/issues"
Changelog = "https://github.com/ignite-ember/igni/releases"

[project.optional-dependencies]
# igni's decisions service (``python -m ember_code.decisions_server``):
# Laya, for Bypass mode's last check and ``host.decide``. It runs in its
# own process — beside a desktop backend, or once per cloud node — so a
# backend image leaves this out and never carries torch. The desktop app
# installs ``ignite-ember[decisions]``.
decisions = [
    "laya~=0.4.4",
    "starlette~=1.9.0",
    "uvicorn~=0.54.0",
]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    # ``make test-cov`` and docs/TESTING.md both pass ``--cov``; without
    # the plugin pytest rejects the unrecognised argument and exits 4,
    # so the documented coverage command has never run.
    "pytest-cov~=7.1.0",
    "ruff~=0.15.6",
    "mypy~=1.19.1",
    "python-dotenv~=1.2.2",
    # Validates ``docs/extension-manifest.schema.json`` and the example
    # manifests against it. It was already importable here as a
    # transitive dependency of something else, which is not a thing a
    # CI gate may rely on.
    "jsonschema~=4.26.0",
]
mcp = [
    # ``~=1.28.1`` capped CVE-2026-59951, whose fix is 1.30.0. This pin
    # has now blocked a fix once; widened to the minor.
    "mcp~=1.30",
]
gemini = [
    "google-genai~=2.8.0",
]
web = [
    "duckduckgo-search~=8.1",
]

[project.scripts]
# ``ignite-ember`` kept for backwards compatibility — existing user
# shell aliases / docs / scripts continue to work. ``igni`` is the
# canonical command going forward; both point at the same entrypoint.
ignite-ember = "ember_code.__main__:main"
igni = "ember_code.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ember_code"]

# The sdist otherwise includes everything git does not ignore, which
# makes a release build depend on how tidy the working tree happens to
# be. A stray virtualenv is the concrete failure: its `bin/python` is an
# absolute symlink, and tarfile refuses it, so `python -m build` dies
# rather than shipping something wrong.
[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv*",
  "/.git",
  "/clients",
  "/evals",
  "/scripts",
  "/docs",
  "/.github",
  "/.pytest_cache",
  "/.mypy_cache",
  "/.ruff_cache",
  "**/__pycache__",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repository root, so ``packages/igni-cloud/tests`` reaches the core's
# ``tests`` helpers and fixtures.
pythonpath = ["."]
markers = [
    # tests/conftest.py runs every test inside the egress guard; this is
    # the one way out, for a test whose subject is reaching the internet.
    "reaches_the_internet: the test reaches a host outside the customer network on purpose; the egress guard stands down",
]

[tool.ruff]
# Deliberately behind ``requires-python``. Raising this to py312 is not
# part of pinning the interpreter — it unlocks 87 pyupgrade findings
# (``datetime.UTC``, ``StrEnum``, bare ``TimeoutError``) across the
# codebase, which is a modernisation sweep that deserves its own change
# rather than riding along inside a version pin.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# ``target-version`` is py310 (see above), which predates ``tomllib``,
# so isort would file a stdlib import under third-party and sort it
# next to pytest. Stating it here keeps the grouping honest without
# dragging in the 87-finding pyupgrade sweep that raising the target
# would.
extra-standard-library = ["tomllib"]

[tool.mypy]
# Matches ``requires-python`` above — the one version this ships on.
# It was 3.11 while the floor was 3.11; type-checking against a version
# the product never runs is how a 3.12-only bug reaches a user green.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["union-attr", "annotation-unchecked", "arg-type", "return-value", "attr-defined", "import-untyped", "call-arg", "override"]

# Historical note, corrected: this override was added when
# ``python_version`` was 3.11. numpy's stubs use PEP 695 ``type X = ...``
# aliases, 3.12 syntax, which mypy will not parse while targeting 3.11 —
# and it does not report that as one skipped dependency, it aborts with
# "errors prevented further checking", so the whole run checked **zero
# files** and still exited non-zero for a reason that named numpy rather
# than this project.
#
# There is no 3.11 floor any more. ``requires-python`` is ">=3.12,<3.13"
# and ``python_version`` above is 3.12, so mypy parses numpy's stubs
# fine and the original abort cannot recur. The skip is kept as a
# deliberate boundary, not a workaround: numpy is a transitive
# dependency whose stubs move on their own release schedule, and a
# stub-side breakage there is not a signal about this codebase. Removing
# it is safe with the currently pinned numpy — dropping it and
# re-running ``mypy src/ember_code/`` still reports success — so if it
# ever starts hiding a real error, delete it rather than work around it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# ``call-arg`` is globally disabled above, which is why SWU-100 could
# happen at all: ``DiscoverMarkdownCommands`` declared a ``__call__``
# without ``group_dir`` while the one call site passed it, and mypy had
# been told not to report exactly that. The Protocol exists *to* be
# checked, so the error code is re-enabled here.
#
# Scoped rather than global on purpose. Dropping "call-arg" from the
# list above reports 7 errors across 5 files; 6 of them are unrelated to
# this module and live in files this change does not own — pydantic
# models populated by field name (``LspServerConfig``, ``TodoItemWire``)
# and two ``VisualizationDeltaEvent`` constructions. Those deserve their
# own pass. The number is recorded here so that pass starts from a known
# size instead of re-discovering it.
[[tool.mypy.overrides]]
module = ["ember_code.backend.markdown_command_dispatcher"]
enable_error_code = ["call-arg"]
